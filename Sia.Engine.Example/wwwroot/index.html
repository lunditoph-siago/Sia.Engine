<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sia.Engine · Scene Example</title>
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    nav {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      background: #17202ee6;
      border-radius: 8px;
      font: 14px system-ui, sans-serif;
    }

    nav a {
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <nav aria-label="Rendering pipeline">
    <a href="?pipeline=pbr">PBR</a>
    <a href="?pipeline=unlit">Unlit</a>
    <a href="?pipeline=normals">World normals</a>
  </nav>
</body>
</html>
