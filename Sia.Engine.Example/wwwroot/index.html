<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sia.Engine · Scene Example</title>
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    nav {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      display: flex;
      flex-wrap: wrap;
      right: 12px;
      gap: 8px;
      padding: 4px;
      background: #17202ee6;
      border-radius: 8px;
      font: 14px system-ui, sans-serif;
    }

    nav a {
      color: #fff;
      padding: 12px 16px;
      border-radius: 6px;
    }

    nav a[aria-current="page"] {
      background: #34445c;
      text-decoration: none;
    }

    #inspection {
      position: fixed;
      bottom: calc(44px + env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      max-width: 560px;
      min-width: 0;
      margin: 0;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #17202ee6;
      color: white;
      font: 13px system-ui, sans-serif;
    }

    #inspection-status {
      margin-bottom: 4px;
    }

    .distance {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #inspection-distance {
      flex: 1;
      min-width: 0;
      height: 44px;
      margin: 0;
      accent-color: #96c8ff;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .controls button {
      flex: 1;
      min-height: 44px;
      padding: 8px;
      border: 1px solid #7e93af;
      border-radius: 6px;
      color: white;
      background: #34445c;
      font: inherit;
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 2px solid #96c8ff;
      outline-offset: 2px;
    }

    .asset-credit {
      position: fixed;
      bottom: max(8px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      color: white;
      font: 11px system-ui, sans-serif;
    }

    .keyboard-help {
      margin: 8px 0 0;
    }

    @media (pointer: coarse), (max-height: 500px) {
      .keyboard-help { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Interactive rendering viewport"></canvas>
  <nav aria-label="Examples">
    <a href="?pipeline=bunny">Bunny</a>
    <a href="?pipeline=pbr">PBR</a>
    <a href="?pipeline=unlit">Unlit</a>
  </nav>
  <fieldset id="inspection" hidden disabled aria-label="Scene controls">
    <div id="inspection-status">Loading scene&hellip;</div>
    <label class="distance">Near <input id="inspection-distance" type="range" min="0" max="1000" value="0" aria-label="Camera distance" /> Far</label>
    <div class="controls">
      <button id="inspection-tour" type="button">Pause tour</button>
      <button id="inspection-material" type="button">Show shaded</button>
      <button id="inspection-reset" type="button">Return near</button>
      <button id="inspection-atmosphere" type="button" hidden>Toggle atmosphere</button>
      <button id="inspection-lod" type="button" hidden>Compare finest</button>
    </div>
    <p class="keyboard-help">W / S or &uarr; / &darr;: near / far &middot; Space: pause &middot; M: material &middot; R: reset</p>
  </fieldset>
  <a id="bunny-credit" class="asset-credit" hidden href="https://graphics.stanford.edu/data/3Dscanrep/">
    Stanford Bunny &middot; Stanford University Computer Graphics Laboratory
  </a>
  <a id="pbr-credit" class="asset-credit" hidden href="https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/AntiqueCamera">
    Antique Camera &middot; UX3D / Maximillan Kamps &middot; CC0
  </a>
</body>
</html>
